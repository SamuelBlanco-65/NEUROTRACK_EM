<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-bright": "#fcf9f4", "surface-container-highest": "#e5e2dd", "secondary-fixed-dim": "#b9cacb", "on-background": "#1c1c19", "primary": "#00424d", "on-surface": "#1c1c19", "on-secondary-fixed-variant": "#3a494b", "surface-container": "#f0ede9", "on-tertiary-fixed": "#241a0f", "tertiary-fixed": "#f3dfcd", "on-error-container": "#93000a", "surface-dim": "#dcdad5", "on-primary-fixed": "#001f25", "error-container": "#ffdad6", "on-tertiary-fixed-variant": "#514437", "outline-variant": "#bfc8ca", "on-primary-container": "#98cfdd", "inverse-on-surface": "#f3f0eb", "primary-fixed": "#b3ecfa", "inverse-primary": "#98cfdd", "primary-container": "#1e5a66", "background": "#fcf9f4", "tertiary-fixed-dim": "#d6c3b2", "on-primary-fixed-variant": "#0b4e5a", "outline": "#70787b", "surface-variant": "#e5e2dd", "secondary-container": "#d5e6e7", "tertiary": "#46392d", "secondary": "#526162", "surface-container-low": "#f6f3ee", "on-error": "#ffffff", "inverse-surface": "#31302d", "on-surface-variant": "#40484a", "on-primary": "#ffffff", "primary-fixed-dim": "#98cfdd", "tertiary-container": "#5e5043", "on-secondary-fixed": "#0f1e1f", "surface-container-high": "#ebe8e3", "surface-container-lowest": "#ffffff", "surface-tint": "#2c6672", "on-secondary-container": "#576768", "secondary-fixed": "#d5e6e7", "on-secondary": "#ffff </head><body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col pt-safe pb-safe selection:bg-secondary-container selection:text-on-secondary-fixed" style="background-color: #1B1E22; color: #F5F1EB;"><main class="flex-1 flex flex-col relative w-full bg-surface px-margin-mobile py-space-lg" style="background-color: #1B1E22;"><div class="flex flex-col w-full">
<!-- Top Bar / Header -->
<div class="flex items-center justify-between w-full mb-space-lg">
<button aria-label="Volver atrás" class="min-w-[48px] min-h-[48px] w-12 h-12 rounded-full flex items-center justify-center bg-surface-container-high text-on-surface hover:bg-surface-container-highest transition-colors active:scale-95" style="background-color: #252A30; border: 1px solid #353C46; color: #ECE6DA;" type="button">
<span class="material-symbols-rounded text-[24px]">arrow_back</span>
</button>
<div class="flex items-center gap-1.5 px-3.5 py-2 rounded-full min-h-[48px]" style="background-color: #19383E; border: 1px solid rgba(130, 213, 227, 0.2); color: #82D5E3;"><span class="material-symbols-rounded text-[20px]" style="font-variation-settings: 'FILL' 1; color: #82D5E3;">person</span><span class="font-label-sm text-label-sm" style="color: #82D5E3;">Perfil: Paciente</span></div>
</div>
<!-- Warm Narrative Intro -->
<div class="flex flex-col gap-1 mb-space-lg"><span class="font-label-sm text-label-sm uppercase tracking-wider" style="color: #6EC6D6;">Neurotrack EM</span><h1 class="font-headline-lg text-headline-lg" style="color: #F5F1EB;">Hola de nuevo</h1><p class="font-body-md text-body-md" style="color: #B8C0CA;">Ingresa a tu espacio de bienestar y seguimiento.</p></div>
<!-- Segmented Control Pill Bar -->
<div aria-label="Tipo de acceso" class="w-full p-1.5 rounded-full flex items-center mb-space-xl" role="tablist" style="background-color: #252A30; border: 1px solid #353C46;"><button aria-selected="true" class="flex-1 min-h-[48px] rounded-full font-label-md text-label-md flex items-center justify-center shadow-sm transition-all" id="tab-login" role="tab" style="background-color: #1E5A66; color: #FFFFFF;" type="button"> Iniciar sesión </button><button aria-selected="false" class="flex-1 min-h-[48px] rounded-full font-label-md text-label-md flex items-center justify-center transition-all" id="tab-register" role="tab" style="background-color: transparent; color: #B8C0CA;" type="button"> Crear cuenta </button></div>
<!-- Form Fields Container -->
<form class="flex flex-col gap-space-lg w-full" onsubmit="event.preventDefault();"><!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md flex items-center gap-1.5" for="email-input" style="color: #ECE6DA;">
<span>Correo electrónico</span>
</label>
<div class="relative flex items-center">
<div class="absolute left-4 pointer-events-none flex items-center justify-center" style="color: #8E9BAA;">
<span class="material-symbols-rounded text-[22px]">mail</span>
</div>
<input autocomplete="email" class="w-full h-14 pl-12 pr-4 rounded-DEFAULT font-body-md text-body-md shadow-sm focus:outline-none transition-shadow" id="email-input" placeholder="ejemplo@correo.com" required="" style="background-color: #22272E; border: 1px solid #3A434E; color: #F5F1EB;" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md flex items-center gap-1.5" for="password-input" style="color: #ECE6DA;">
<span>Contraseña</span>
</label>
<div class="relative flex items-center">
<div class="absolute left-4 pointer-events-none flex items-center justify-center" style="color: #8E9BAA;">
<span class="material-symbols-rounded text-[22px]">lock</span>
</div>
<input autocomplete="current-password" class="w-full h-14 pl-12 pr-14 rounded-DEFAULT font-body-md text-body-md shadow-sm focus:outline-none transition-shadow" id="password-input" placeholder="••••••••••••" required="" style="background-color: #22272E; border: 1px solid #3A434E; color: #F5F1EB;" type="password"/>
<button aria-label="Mostrar contraseña" class="absolute right-1 min-w-[48px] min-h-[48px] w-12 h-12 flex items-center justify-center rounded-full transition-colors" id="toggle-password" style="color: #8E9BAA;" type="button">
<span class="material-symbols-rounded text-[22px]" id="password-icon">visibility</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end pt-1">
<a class="min-h-[48px] inline-flex items-center font-label-md text-label-md underline underline-offset-4 active:opacity-80" href="#recuperar" style="color: #6EC6D6; text-decoration-color: rgba(110, 198, 214, 0.4);">
 ¿Olvidaste tu contraseña?
 </a>
</div>
</div>
<!-- Primary Action Button -->
<div class="pt-space-xs">
<button class="w-full h-14 min-h-[56px] rounded-full font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md active:scale-[0.99] transition-transform" style="background-color: #267280; color: #FFFFFF;" type="submit">
<span>Iniciar sesión</span>
<span class="material-symbols-rounded text-[22px]">arrow_forward</span>
</button>
</div></form>
<!-- Tagline Quote Note -->
<div class="mt-space-xl p-4 rounded-DEFAULT flex items-center gap-3" style="background-color: #30261C; border: 1px solid #4A3B2A;"><div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0" style="background-color: #433324; color: #E8B482;"><span class="material-symbols-rounded text-[22px]" style="font-variation-settings: 'FILL' 1; color: #E8B482;">spa</span></div><div class="flex flex-col"><span class="font-label-sm text-label-sm font-bold" style="color: #F3D2B3;">Un paso a la vez</span><span class="font-body-sm text-body-sm" style="color: #D8BEA6;">Tu evolución, tu proceso, tu camino.</span></div></div>
<!-- Reassurance & Privacy Section -->
<div class="mt-space-lg mb-space-sm p-4 rounded-DEFAULT flex items-start gap-3" style="background-color: #22272E; border: 1px solid #303741;"><div class="min-w-[32px] min-h-[32px] flex items-center justify-center shrink-0 mt-0.5" style="color: #6EC6D6;"><span class="material-symbols-rounded text-[22px]" style="font-variation-settings: 'FILL' 1; color: #6EC6D6;">verified_user</span></div><p class="font-body-sm text-body-sm leading-relaxed" style="color: #B8C0CA;"> Tus datos de salud se guardan cifrados y solo tú decides quién los ve. </p></div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('password-input');
    const toggleButton = document.getElementById('toggle-password');
    const passwordIcon = document.getElementById('password-icon');

    if (toggleButton && passwordInput && passwordIcon) {
      toggleButton.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        if (isPassword) {
          passwordInput.setAttribute('type', 'text');
          passwordIcon.textContent = 'visibility_off';
          toggleButton.setAttribute('aria-label', 'Ocultar contraseña');
        } else {
          passwordInput.setAttribute('type', 'password');
          passwordIcon.textContent = 'visibility';
          toggleButton.setAttribute('aria-label', 'Mostrar contraseña');
        }
      });
    }

    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');

    if (tabLogin && tabRegister) {
      tabRegister.addEventListener('click', function() {
        tabRegister.classList.add('bg-primary-container', 'text-on-primary', 'shadow-sm');
        tabRegister.classList.remove('text-on-surface-variant');
        tabRegister.setAttribute('aria-selected', 'true');

        tabLogin.classList.remove('bg-primary-container', 'text-on-primary', 'shadow-sm');
        tabLogin.classList.add('text-on-surface-variant');
        tabLogin.setAttribute('aria-selected', 'false');
      });

      tabLogin.addEventListener('click', function() {
        tabLogin.classList.add('bg-primary-container', 'text-on-primary', 'shadow-sm');
        tabLogin.classList.remove('text-on-surface-variant');
        tabLogin.setAttribute('aria-selected', 'true');

        tabRegister.classList.remove('bg-primary-container', 'text-on-primary', 'shadow-sm');
        tabRegister.classList.add('text-on-surface-variant');
        tabRegister.setAttribute('aria-selected', 'false');
      });
    }
  })();
</script></main></body></html>
