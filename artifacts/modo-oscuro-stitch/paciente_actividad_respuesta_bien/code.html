</head><body class="bg-[#1B1E22] font-body-md text-body-md text-[#ECE6DA] flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-[#181B1F]/90 backdrop-blur-xl pt-safe shadow-[0_1px_12px_rgba(0,0,0,0.45)] border-b border-[#252B33]"><div class="h-16 px-margin flex items-center justify-between gap-space-sm"><div class="flex items-center min-w-[48px]"><button aria-label="Pausar y salir" class="min-w-[48px] min-h-[48px] px-space-xs rounded-full flex items-center gap-space-xs text-[#ECE6DA] hover:text-[#FFFFFF] hover:bg-[#252A30] transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">pause_circle</span><span class="font-label-sm text-label-sm hidden sm:inline text-[#ECE6DA]">Pausar y salir</span></button></div><div class="flex flex-col items-center justify-center flex-1 px-space-xs text-center"><h1 class="font-headline-sm text-headline-sm text-[#ECE6DA] line-clamp-1">Sesión De Ejercicio</h1></div><div class="flex items-center justify-end min-w-[48px]"><div class="w-8 h-8 rounded-full bg-[#236B78] flex items-center justify-center"><span class="material-symbols-outlined text-[#ECE6DA] text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-16 pb-safe bg-[#1B1E22] min-h-screen"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Progress Section -->
<section aria-label="Progreso de la secuencia" class="flex flex-col items-center justify-center pt-space-md pb-space-sm">
<div class="inline-flex items-center gap-space-xs px-space-md py-1 rounded-full bg-[#252A30] border border-[#353C46] mb-space-sm">
<span class="w-2 h-2 rounded-full bg-[#4AA0B0]"></span>
<span class="font-label-md text-label-md text-[#ECE6DA]">Paso 2 de 4</span>
</div>
<!-- 4 Horizontal Progress Segments -->
<div aria-valuemax="4" aria-valuemin="0" aria-valuenow="2" class="flex items-center justify-center gap-2 w-full max-w-[240px]" role="progressbar">
<div class="h-2 flex-1 rounded-full bg-[#4AA0B0] transition-all duration-300"></div>
<div class="h-2 flex-1 rounded-full bg-[#4AA0B0] transition-all duration-300"></div>
<div class="h-2 flex-1 rounded-full bg-[#353C46] transition-all duration-300"></div>
<div class="h-2 flex-1 rounded-full bg-[#353C46] transition-all duration-300"></div>
</div>
</section>
<!-- Supportive Instruction Header -->
<section class="text-center pt-space-xs pb-space-md">
<h2 class="font-headline-md text-headline-md text-[#F5F1EB] font-bold tracking-tight">
      Toca las figuras en el mismo orden en que aparecieron.
    </h2>
<p class="font-body-sm text-body-sm text-[#A2ACB7] mt-1">
      Tómate tu tiempo. Sin límites ni prisas.
    </p>
</section>
<!-- 2x2 Interactive Grid Area (Designed for Tremor-Tolerant, Large Surfaces) -->
<section aria-label="Tablero de patrones" class="w-full my-space-xs">
<div class="grid grid-cols-2 gap-space-md w-full max-w-[360px] mx-auto">
<!-- 1. Top-Left Tile: Círculo (CORRECT TAP FEEDBACK STATE) -->
<button aria-label="Círculo, seleccionado correctamente, paso 1 completado" aria-pressed="true" class="relative flex flex-col items-center justify-center h-[142px] rounded-lg bg-[#1D3136] text-[#ECE6DA] border border-[#3A7580] shadow-sm active:scale-95 transition-transform" id="tile-circulo" type="button">
<!-- Subtle Affirming Ring Accent -->
<span class="absolute inset-0 rounded-lg pointer-events-none shadow-[inset_0_0_0_2px_#3A7580]"></span>
<!-- Affirming Checkmark Badge -->
<div class="absolute top-3 right-3 w-8 h-8 rounded-full bg-[#236B78] text-[#FFFFFF] flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<!-- Shape Graphic: Circle -->
<div class="w-14 h-14 rounded-full bg-[#236B78]/35 flex items-center justify-center mb-space-xs">
<svg aria-hidden="true" class="w-9 h-9 text-[#6EC6D6]" fill="currentColor" viewbox="0 0 36 36">
<circle cx="18" cy="18" r="14"></circle>
</svg>
</div>
<span class="font-label-lg text-label-lg text-[#FFFFFF] font-bold">Círculo</span>
</button>
<!-- 2. Top-Right Tile: Estrella (Normal State) -->
<button aria-label="Estrella" aria-pressed="false" class="relative flex flex-col items-center justify-center h-[142px] rounded-lg bg-[#22272E] border border-[#2E353F] text-[#ECE6DA] shadow-sm hover:border-[#3A434D] active:bg-[#252B33] active:scale-95 transition-all" id="tile-estrella" type="button">
<!-- Shape Graphic: Star -->
<div class="w-14 h-14 rounded-full bg-[#2B313A] flex items-center justify-center mb-space-xs">
<svg aria-hidden="true" class="w-9 h-9 text-[#ECE6DA]" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 2l2.9 6.26L21.8 9.27l-5.1 4.73 1.39 6.94L12 17.27l-6.09 3.67 1.39-6.94-5.1-4.73 6.9-1.01L12 2z"></path>
</svg>
</div>
<span class="font-label-lg text-label-lg text-[#ECE6DA] font-bold">Estrella</span>
</button>
<!-- 3. Bottom-Left Tile: Hoja (Normal State) -->
<button aria-label="Hoja" aria-pressed="false" class="relative flex flex-col items-center justify-center h-[142px] rounded-lg bg-[#22272E] border border-[#2E353F] text-[#ECE6DA] shadow-sm hover:border-[#3A434D] active:bg-[#252B33] active:scale-95 transition-all" id="tile-hoja" type="button">
<!-- Shape Graphic: Leaf -->
<div class="w-14 h-14 rounded-full bg-[#2B313A] flex items-center justify-center mb-space-xs">
<svg aria-hidden="true" class="w-9 h-9 text-[#ECE6DA]" fill="currentColor" viewbox="0 0 24 24">
<path d="M17 8C8 10 5.9 16.17 3.82 21.34l1.84.66C7.6 17.24 9.8 12 17 10V8zm4-6c-6.63 0-12 5.37-12 12 0 1.25.19 2.45.54 3.58C11.53 14.7 15.34 12 20 12v-2c-3.1 0-5.74 1.4-7.46 3.56C12.18 12.59 12 11.32 12 10c0-4.41 3.59-8 8-8h1V2h-1z"></path>
</svg>
</div>
<span class="font-label-lg text-label-lg text-[#ECE6DA] font-bold">Hoja</span>
</button>
<!-- 4. Bottom-Right Tile: Ola (Normal State) -->
<button aria-label="Ola" aria-pressed="false" class="relative flex flex-col items-center justify-center h-[142px] rounded-lg bg-[#22272E] border border-[#2E353F] text-[#ECE6DA] shadow-sm hover:border-[#3A434D] active:bg-[#252B33] active:scale-95 transition-all" id="tile-ola" type="button">
<!-- Shape Graphic: Wave -->
<div class="w-14 h-14 rounded-full bg-[#2B313A] flex items-center justify-center mb-space-xs">
<svg aria-hidden="true" class="w-9 h-9 text-[#ECE6DA]" fill="currentColor" viewbox="0 0 24 24">
<path d="M2 13c2 0 3-1.5 5-1.5s3 1.5 5 1.5 3-1.5 5-1.5 3 1.5 5 1.5v-2c-2 0-3-1.5-5-1.5s-3 1.5-5 1.5-3-1.5-5-1.5-3 1.5-5 1.5v2zm0 4c2 0 3-1.5 5-1.5s3 1.5 5 1.5 3-1.5 5-1.5 3 1.5 5 1.5v-2c-2 0-3-1.5-5-1.5s-3 1.5-5 1.5-3-1.5-5-1.5-3 1.5-5 1.5v2z"></path>
</svg>
</div>
<span class="font-label-lg text-label-lg text-[#ECE6DA] font-bold">Ola</span>
</button>
</div>
</section>
<!-- Reassuring, Gentle Feedback Banner (Finch-Inspired Emotional Comfort) -->
<section aria-live="polite" class="w-full max-w-[360px] mx-auto mt-space-md">
<div class="w-full p-space-md rounded-lg bg-[#163328] border border-[#245240] text-[#DDF5E8] flex items-center gap-space-sm shadow-md">
<div class="w-11 h-11 rounded-full bg-[#1E4D38] text-[#7FE3B5] flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[26px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="flex flex-col min-w-0">
<div class="flex items-center gap-space-xs">
<span class="font-label-lg text-label-lg text-[#FFFFFF] font-bold">¡Bien!</span>
<span class="text-xs px-2 py-0.5 rounded-full bg-[#1E4D38] text-[#7FE3B5] font-medium border border-[#245240]">Secuencia en marcha</span>
</div>
<p class="font-body-sm text-body-sm text-[#DDF5E8] truncate mt-0.5">
          Paso reconocido con éxito.
        </p>
</div>
</div>
</section>
<!-- Bottom Secondary Control (Tremor-Friendly Height) -->
<section class="flex flex-col items-center justify-center mt-space-lg mb-space-sm">
<button aria-label="Ver la secuencia otra vez" class="min-h-[48px] px-space-lg py-2.5 rounded-full bg-[#252B33] border border-[#3A434D] text-[#ECE6DA] hover:bg-[#2F3742] hover:text-[#6EC6D6] active:scale-98 transition-all flex items-center gap-space-xs font-label-md text-label-md shadow-sm" id="replay-btn" type="button">
<span class="material-symbols-outlined text-[20px] text-[#6EC6D6]">replay</span>
<span>Ver la secuencia otra vez</span>
</button>
</section>
</div>
<script>
  (function() {
    const replayBtn = document.getElementById('replay-btn');
    if (replayBtn) {
      replayBtn.addEventListener('click', function() {
        const originalText = replayBtn.innerHTML;
        replayBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">sync</span><span>Reproduciendo secuencia...</span>';
        replayBtn.setAttribute('disabled', 'true');
        replayBtn.classList.add('opacity-70');
        
        setTimeout(() => {
          replayBtn.innerHTML = originalText;
          replayBtn.removeAttribute('disabled');
          replayBtn.classList.remove('opacity-70');
        }, 1500);
      });
    }
  })();
</script></main></body></html>
