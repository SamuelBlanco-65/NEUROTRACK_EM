</head><body class="bg-[#1B1E22] font-body-md text-body-md text-[#ECE6DA] flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-[#181B1F]/90 backdrop-blur-xl pt-safe border-b border-[#2D333B] shadow-sm"><div class="h-16 px-margin flex items-center justify-between gap-space-sm"><div class="flex items-center min-w-[48px]"><button aria-label="Pausar y salir" class="min-w-[48px] min-h-[48px] px-space-xs rounded-full flex items-center gap-space-xs text-[#B8C0CA] hover:text-[#F5F1EB] hover:bg-[#22272E] transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">pause_circle</span><span class="font-label-sm text-label-sm hidden sm:inline">Pausar y salir</span></button></div><div class="flex flex-col items-center justify-center flex-1 px-space-xs text-center"><h1 class="font-headline-sm text-headline-sm text-[#F5F1EB] line-clamp-1">Sesión De Ejercicio</h1></div><div class="flex items-center justify-end min-w-[48px]"><div class="w-8 h-8 rounded-full bg-[#236B78] flex items-center justify-center"><span class="material-symbols-outlined text-[#F5F1EB] text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-16 pb-safe bg-[#1B1E22] min-h-screen"><div class="flex flex-col w-full max-w-md mx-auto px-margin pb-space-xl">
<!-- Progress Indicator Section -->
<section aria-label="Progreso de la sesión" class="flex flex-col items-center justify-center pt-space-sm pb-space-md">
<span class="font-label-md text-label-md text-[#A2ACB7] mb-space-xs tracking-wide">
      Paso 2 de 4
    </span>
<div aria-label="Paso 2 completándose de 4" aria-valuemax="4" aria-valuemin="1" aria-valuenow="2" class="flex items-center gap-space-xs w-48 justify-center" role="progressbar">
<div class="h-2 w-10 rounded-full bg-[#4AA0B0] transition-all duration-300"></div>
<div class="h-2 w-10 rounded-full bg-[#4AA0B0] transition-all duration-300"></div>
<div class="h-2 w-10 rounded-full bg-[#353C46] transition-all duration-300"></div>
<div class="h-2 w-10 rounded-full bg-[#353C46] transition-all duration-300"></div>
</div>
</section>
<!-- Empathetic Instructions Box -->
<section class="bg-[#22272E] border border-[#2D353F] rounded-lg p-space-md shadow-[0_4px_16px_rgba(0,0,0,0.25)] text-center my-space-xs flex flex-col items-center">
<div class="w-10 h-10 rounded-full bg-[#1D2D31] border border-[#236B78]/40 flex items-center justify-center text-[#4AA0B0] mb-space-xs">
<span class="material-symbols-outlined text-[24px]">psychology</span>
</div>
<h2 class="font-headline-sm text-headline-sm text-[#F5F1EB] font-bold leading-snug max-w-xs">
      Toca las figuras en el mismo orden en que aparecieron.
    </h2>
<div class="inline-flex items-center gap-space-xs mt-space-xs text-[#B8C0CA] bg-[#1B1E22] border border-[#2D333B] px-space-sm py-1.5 rounded-full">
<span class="material-symbols-outlined text-[18px] text-[#4AA0B0]">cloud_download</span>
<p class="font-body-sm text-body-sm font-normal text-[#ECE6DA]">
        Tómate tu tiempo. Sin cronómetro ni prisas.
      </p>
</div>
</section>
<!-- Interactive Tactile Grid (Tremor Tolerant, Generous Touch Hitboxes) -->
<main aria-label="Tablero de figuras interactivas" class="w-full my-space-md">
<div class="grid grid-cols-2 gap-space-md w-full">
<!-- Tile 1: Círculo -->
<button aria-label="Figura Círculo" class="group relative flex flex-col items-center justify-center min-h-[148px] bg-[#22272E] border border-[#2E353F] active:bg-[#272D35] hover:border-[#4AA0B0]/50 rounded-lg p-space-md shadow-[0_6px_20px_rgba(0,0,0,0.2)] active:scale-95 transition-all duration-200 focus:outline-none select-none" id="tile-circle" onclick="handleTilePress(this, 'Círculo')" type="button">
<div class="w-16 h-16 rounded-full bg-[#1D2D31] border border-[#2D3B40] flex items-center justify-center mb-space-xs group-hover:scale-105 transition-transform duration-200">
<span class="material-symbols-outlined text-[38px] text-[#6EC6D6]" style="font-variation-settings: 'FILL' 1;">radio_button_unchecked</span>
</div>
<span class="font-label-lg text-label-lg text-[#F5F1EB] tracking-wide mt-1">Círculo</span>
<span class="absolute top-2 right-2 w-3 h-3 rounded-full bg-transparent transition-colors duration-200 feedback-dot"></span>
</button>
<!-- Tile 2: Estrella -->
<button aria-label="Figura Estrella" class="group relative flex flex-col items-center justify-center min-h-[148px] bg-[#22272E] border border-[#2E353F] active:bg-[#272D35] hover:border-[#4AA0B0]/50 rounded-lg p-space-md shadow-[0_6px_20px_rgba(0,0,0,0.2)] active:scale-95 transition-all duration-200 focus:outline-none select-none" id="tile-star" onclick="handleTilePress(this, 'Estrella')" type="button">
<div class="w-16 h-16 rounded-full bg-[#1D2D31] border border-[#2D3B40] flex items-center justify-center mb-space-xs group-hover:scale-105 transition-transform duration-200">
<span class="material-symbols-outlined text-[38px] text-[#6EC6D6]" style="font-variation-settings: 'FILL' 1;">grade</span>
</div>
<span class="font-label-lg text-label-lg text-[#F5F1EB] tracking-wide mt-1">Estrella</span>
<span class="absolute top-2 right-2 w-3 h-3 rounded-full bg-transparent transition-colors duration-200 feedback-dot"></span>
</button>
<!-- Tile 3: Hoja -->
<button aria-label="Figura Hoja" class="group relative flex flex-col items-center justify-center min-h-[148px] bg-[#22272E] border border-[#2E353F] active:bg-[#272D35] hover:border-[#4AA0B0]/50 rounded-lg p-space-md shadow-[0_6px_20px_rgba(0,0,0,0.2)] active:scale-95 transition-all duration-200 focus:outline-none select-none" id="tile-leaf" onclick="handleTilePress(this, 'Hoja')" type="button">
<div class="w-16 h-16 rounded-full bg-[#1D2D31] border border-[#2D3B40] flex items-center justify-center mb-space-xs group-hover:scale-105 transition-transform duration-200">
<span class="material-symbols-outlined text-[38px] text-[#6EC6D6]" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
<span class="font-label-lg text-label-lg text-[#F5F1EB] tracking-wide mt-1">Hoja</span>
<span class="absolute top-2 right-2 w-3 h-3 rounded-full bg-transparent transition-colors duration-200 feedback-dot"></span>
</button>
<!-- Tile 4: Ola -->
<button aria-label="Figura Ola" class="group relative flex flex-col items-center justify-center min-h-[148px] bg-[#22272E] border border-[#2E353F] active:bg-[#272D35] hover:border-[#4AA0B0]/50 rounded-lg p-space-md shadow-[0_6px_20px_rgba(0,0,0,0.2)] active:scale-95 transition-all duration-200 focus:outline-none select-none" id="tile-wave" onclick="handleTilePress(this, 'Ola')" type="button">
<div class="w-16 h-16 rounded-full bg-[#1D2D31] border border-[#2D3B40] flex items-center justify-center mb-space-xs group-hover:scale-105 transition-transform duration-200">
<span class="material-symbols-outlined text-[38px] text-[#6EC6D6]" style="font-variation-settings: 'FILL' 1;">waves</span>
</div>
<span class="font-label-lg text-label-lg text-[#F5F1EB] tracking-wide mt-1">Ola</span>
<span class="absolute top-2 right-2 w-3 h-3 rounded-full bg-transparent transition-colors duration-200 feedback-dot"></span>
</button>
</div>
</main>
<!-- Live Micro-Reassurance Banner (Finch-inspired emotional warmth) -->
<div class="w-full flex items-center justify-center min-h-[44px] mb-space-xs">
<div class="bg-[#22272E] border border-[#2D333B] text-[#ECE6DA] px-space-md py-space-xs rounded-full flex items-center gap-space-xs transition-opacity duration-300 opacity-95 shadow-sm" id="reassurance-toast">
<span class="material-symbols-outlined text-[20px] text-[#4AA0B0]" id="toast-icon">spa</span>
<span class="font-body-sm text-body-sm text-[#B8C0CA] font-normal" id="toast-text">
        Respira con calma y pulsa a tu ritmo.
      </span>
</div>
</div>
<!-- Accessible Calm Action Section -->
<footer class="w-full flex flex-col items-center gap-space-sm pt-space-xs pb-space-lg">
<!-- Replay / Review Action Button -->
<button aria-label="Ver la secuencia otra vez sin penalización" class="w-full min-h-[52px] px-space-lg py-space-xs rounded-full bg-[#252B33] border border-[#3A434D] text-[#6EC6D6] hover:bg-[#1E3338] hover:border-[#4AA0B0] active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-space-xs font-label-lg text-label-lg shadow-sm" onclick="replayPatternSequence()" type="button">
<span class="material-symbols-outlined text-[24px]">replay</span>
<span>Ver la secuencia otra vez</span>
</button>
</footer>
</div>
<script>
  // Calm tactile sequence handler with sensory feedback for MS accessibility
  let touchCount = 0;
  const affirmations = [
    { text: "Muy bien, sin prisa.", icon: "sentiment_satisfied" },
    { text: "Excelente concentración.", icon: "self_improvement" },
    { text: "Cada intento entrena tu bienestar.", icon: "favorite" },
    { text: "Avanzando a tu paso natural.", icon: "check_circle" }
  ];

  function handleTilePress(buttonEl, label) {
    touchCount++;
    
    // Tactile dot glow feedback
    const dot = buttonEl.querySelector('.feedback-dot');
    if (dot) {
      dot.classList.remove('bg-transparent');
      dot.classList.add('bg-[#4AA0B0]');
      setTimeout(() => {
        dot.classList.remove('bg-[#4AA0B0]');
        dot.classList.add('bg-transparent');
      }, 500);
    }

    // Accessible Finch-style warm feedback update
    const toast = document.getElementById('reassurance-toast');
    const toastText = document.getElementById('toast-text');
    const toastIcon = document.getElementById('toast-icon');

    if (toast && toastText && toastIcon) {
      const choice = affirmations[(touchCount - 1) % affirmations.length];
      toastText.textContent = `${label} registrado. ${choice.text}`;
      toastIcon.textContent = choice.icon;
      
      toast.classList.remove('opacity-95');
      toast.classList.add('opacity-100', 'bg-[#272D35]', 'border-[#4AA0B0]/40');
      setTimeout(() => {
        toast.classList.remove('bg-[#272D35]', 'border-[#4AA0B0]/40');
        toast.classList.add('opacity-95');
      }, 1000);
    }
  }

  function replayPatternSequence() {
    const toastText = document.getElementById('toast-text');
    const toastIcon = document.getElementById('toast-icon');
    if (toastText && toastIcon) {
      toastText.textContent = "Mostrando de nuevo la secuencia...";
      toastIcon.textContent = "motion_photos_on";
    }

    const tiles = ['tile-circle', 'tile-star', 'tile-leaf'];
    tiles.forEach((id, index) => {
      setTimeout(() => {
        const el = document.getElementById(id);
        if (el) {
          el.classList.add('border-[#4AA0B0]', 'bg-[#1D2D31]');
          setTimeout(() => {
            el.classList.remove('border-[#4AA0B0]', 'bg-[#1D2D31]');
          }, 600);
        }
      }, (index + 1) * 700);
    });

    setTimeout(() => {
      if (toastText && toastIcon) {
        toastText.textContent = "¡Listo! Es tu turno, con toda calma.";
        toastIcon.textContent = "touch_app";
      }
    }, (tiles.length + 1) * 700);
  }
</script></main></body></html>
