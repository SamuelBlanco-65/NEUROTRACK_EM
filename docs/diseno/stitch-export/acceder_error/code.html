<!DOCTYPE html>

<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-bright": "#fcf9f4", "surface-container-highest": "#e5e2dd", "secondary-fixed-dim": "#b9cacb", "on-background": "#1c1c19", "primary": "#00424d", "on-surface": "#1c1c19", "on-secondary-fixed-variant": "#3a494b", "surface-container": "#f0ede9", "on-tertiary-fixed": "#241a0f", "tertiary-fixed": "#f3dfcd", "on-error-container": "#93000a", "surface-dim": "#dcdad5", "on-primary-fixed": "#001f25", "error-container": "#ffdad6", "on-tertiary-fixed-variant": "#514437", "outline-variant": "#bfc8ca", "on-primary-container": "#98cfdd", "inverse-on-surface": "#f3f0eb", "primary-fixed": "#b3ecfa", "inverse-primary": "#98cfdd", "primary-container": "#1e5a66", "background": "#fcf9f4", "tertiary-fixed-dim": "#d6c3b2", "on-primary-fixed-variant": "#0b4e5a", "outline": "#70787b", "surface-variant": "#e5e2dd", "secondary-container": "#d5e6e7", "tertiary": "#46392d", "secondary": "#526162", "surface-container-low": "#f6f3ee", "on-error": "#ffffff", "inverse-surface": "#31302d", "on-surface-variant": "#40484a", "on-primary": "#ffffff", "primary-fixed-dim": "#98cfdd", "tertiary-container": "#5e5043", "on-secondary-fixed": "#0f1e1f", "surface-container-high": "#ebe8e3", "surface-container-lowest": "#ffffff", "surface-tint": "#2c6672", "on-secondary-container": "#576768", "secondary-fixed": "#d5e6e7", "on-secondary": "#ffffff", "error": "#ba1a1a", "on-tertiary-container": "#d6c3b2", "on-tertiary": "#ffffff", "surface": "#fcf9f4" }, borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, spacing: { "space-lg": "1.5rem", "gutter-mobile": "1rem", "space-xs": "0.375rem", "gutter": "1rem", "space-md": "1rem", "space-xl": "2.25rem", "space-sm": "0.75rem", "margin": "1.25rem", "margin-mobile": "1.25rem" }, fontFamily: { "body-lg": ["Atkinson Hyperlegible Next"], "body-md": ["Atkinson Hyperlegible Next"], "label-md": ["Atkinson Hyperlegible Next"], "label-lg": ["Atkinson Hyperlegible Next"], "headline-sm": ["Atkinson Hyperlegible Next"], "headline-md": ["Atkinson Hyperlegible Next"], "body-sm": ["Atkinson Hyperlegible Next"], "headline-lg": ["Atkinson Hyperlegible Next"], "label-sm": ["Atkinson Hyperlegible Next"] }, fontSize: { "body-lg": ["19px", { "lineHeight": "28px", "fontWeight": "400" }], "body-md": ["17px", { "lineHeight": "26px", "fontWeight": "400" }], "label-md": ["15px", { "lineHeight": "20px", "fontWeight": "700" }], "label-lg": ["17px", { "lineHeight": "24px", "fontWeight": "700" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "700" }], "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }], "body-sm": ["15px", { "lineHeight": "22px", "fontWeight": "400" }], "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }], "label-sm": ["13px", { "lineHeight": "18px", "fontWeight": "700" }] } } } };</script><style>
    body {

  </head><body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col pt-safe pb-safe selection:bg-secondary-container selection:text-on-secondary-fixed"><main class="flex-1 flex flex-col relative w-full bg-surface px-margin-mobile py-space-lg"><div class="flex flex-col w-full max-w-[390px] mx-auto pb-6">
<!-- Top Navigation Bar -->
<div class="flex items-center justify-between w-full mb-6">
<button aria-label="Volver" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container hover:bg-surface-container-high transition-colors active:scale-95 text-on-surface" type="button">
<span class="material-symbols-rounded text-2xl">arrow_back</span>
</button>
<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-secondary-container text-on-secondary-fixed">
<span class="material-symbols-rounded text-lg text-primary">person</span>
<span class="font-label-sm text-label-sm">Perfil: Paciente</span>
</div>
</div>
<!-- Warm Welcome Greeting -->
<div class="flex flex-col mb-6">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Hola de nuevo</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Tu evolución, tu proceso, tu camino.</p>
</div>
<!-- Mode Selector / Segmented Control -->
<div class="w-full bg-surface-container p-1 rounded-full flex mb-6">
<button class="flex-1 py-2.5 rounded-full bg-surface-container-lowest text-primary font-label-md text-label-md shadow-sm transition-all text-center" type="button">
      Iniciar sesión
    </button>
<button class="flex-1 py-2.5 rounded-full text-secondary font-label-md text-label-md hover:text-on-surface transition-all text-center" type="button">
      Crear cuenta
    </button>
</div>
<!-- Authentication Form -->
<form class="flex flex-col w-full space-y-5" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col">
<label class="font-label-md text-label-md text-on-surface mb-2 pl-1" for="email">
        Correo electrónico
      </label>
<div class="relative flex items-center">
<input class="w-full h-14 pl-4 pr-12 rounded-full bg-surface-container-lowest text-on-surface font-body-md text-body-md shadow-sm focus:outline-none" id="email" style="box-shadow: inset 0 0 0 1.5px #EBE4D8;" type="email" value="sofia.m@correo.com"/>
<div class="absolute right-4 text-secondary">
<span class="material-symbols-rounded text-xl">mail</span>
</div>
</div>
</div>
<!-- Password Field (WithError State) -->
<div class="flex flex-col">
<label class="font-label-md text-label-md text-on-surface mb-2 pl-1" for="password">
        Contraseña
      </label>
<div class="relative flex items-center">
<input aria-describedby="password-error" aria-invalid="true" class="w-full h-14 pl-4 pr-12 rounded-full bg-surface-container-lowest text-on-surface font-body-md text-body-md shadow-sm focus:outline-none" id="password" style="box-shadow: inset 0 0 0 2px #8A4513;" type="password" value="••••••••••••"/>
<button aria-label="Mostrar contraseña" class="absolute right-3.5 w-8 h-8 flex items-center justify-center text-secondary hover:text-on-surface" type="button">
<span class="material-symbols-rounded text-xl">visibility</span>
</button>
</div>
<!-- Warm Double-Coded Error Feedback -->
<div class="flex items-center gap-2 mt-2 px-3 py-2 rounded-lg bg-tertiary-fixed/60" id="password-error" role="alert">
<span class="material-symbols-rounded text-xl flex-shrink-0" style="color: #8A4513;">error</span>
<span class="font-label-md text-label-md text-on-surface">Correo o contraseña incorrectos</span>
</div>
</div>
<!-- Recovery Link -->
<div class="flex justify-end pt-1">
<a class="font-label-md text-label-md text-primary-container hover:underline py-1" href="javascript:void(0)">
        ¿Olvidaste tu contraseña?
      </a>
</div>
<!-- Primary Action Button -->
<div class="pt-3">
<button class="w-full h-14 rounded-full bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md active:scale-[0.99] transition-transform" type="submit">
<span>Iniciar sesión</span>
<span class="material-symbols-rounded text-xl">arrow_forward</span>
</button>
</div>
</form>
<!-- Calming Privacy Reassurance -->
<div class="mt-8 flex items-start gap-3 p-4 rounded-xl bg-surface-container-low text-secondary">
<span class="material-symbols-rounded text-xl flex-shrink-0 mt-0.5 text-primary">lock</span>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
      Tus datos de salud se guardan cifrados y solo tú decides quién los ve.
    </p>
</div>
</div></main></body></html>
