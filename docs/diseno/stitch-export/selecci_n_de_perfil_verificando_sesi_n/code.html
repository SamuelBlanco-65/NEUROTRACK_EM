</div>

</div>

<div aria-hidden="true" class="w-full bg-surface-container-lowest rounded-DEFAULT p-5 shadow-sm flex items-center gap-4 relative overflow-hidden">

<div class="absolute inset-0 -translate-x-full animate-[shimmer_2.2s_infinite] bg-gradient-to-r from-transparent via-surface-container-low/80 to-transparent"></div>

<div class="w-12 h-12 rounded-full bg-surface-container flex-shrink-0 flex items-center justify-center">
<div class="w-6 h-6 rounded-full bg-surface-container-highest/60"></div>

<div class="flex-1 flex flex-col gap-2.5">

</div>
<!-- Soft Placeholder Chevron -->
<div class="w-6 h-6 rounded-full bg-surface-container-low/70 flex-shrink-0"></div>
</div>
</div>
<!-- Bottom Helpful Context Link Skeleton -->
<div class="w-full flex flex-col items-center pb-4">
<div aria-hidden="true" class="h-7 w-48 rounded-full bg-surface-container-high/60 relative overflow-hidden">
<div class="absolute inset-0 -translate-x-full animate-[shimmer_2.2s_infinite] bg-gradient-to-r from-transparent via-surface-container-lowest/80 to-transparent"></div>
</div>
<!-- Gentle reassuring note for sensory ease -->
<span class="font-label-sm text-label-sm text-outline-variant mt-3 text-center tracking-normal">
      Conexión segura y privada
    </span>
</div>
</div>
<script>
  // Dynamic shimmer keyframe insertion if not natively defined
  (function() {
    if (!document.getElementById('shimmer-keyframes')) {
      const style = document.createElement('style');
      style.id = 'shimmer-keyframes';
      style.textContent = `
        @keyframes shimmer {
          100% {
            transform: translateX(100%);
          }
        }
      `;
      document.head.appendChild(style);
    }
  })();
