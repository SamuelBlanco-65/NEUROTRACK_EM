<!DOCTYPE html>

<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-bright": "#fcf9f4", "surface-container-highest": "#e5e2dd", "secondary-fixed-dim": "#b9cacb", "on-background": "#1c1c19", "primary": "#00424d", "on-surface": "#1c1c19", "on-secondary-fixed-variant": "#3a494b", "surface-container": "#f0ede9", "on-tertiary-fixed": "#241a0f", "tertiary-fixed": "#f3dfcd", "on-error-container": "#93000a", "surface-dim": "#dcdad5", "on-primary-fixed": "#001f25", "error-container": "#ffdad6", "on-tertiary-fixed-variant": "#514437", "outline-variant": "#bfc8ca", "on-primary-container": "#98cfdd", "inverse-on-surface": "#f3f0eb", "primary-fixed": "#b3ecfa", "inverse-primary": "#98cfdd", "primary-container": "#1e5a66", "background": "#fcf9f4", "tertiary-fixed-dim": "#d6c3b2", "on-primary-fixed-variant": "#0b4e5a", "outline": "#70787b", "surface-variant": "#e5e2dd", "secondary-container": "#d5e6e7", "tertiary": "#46392d", "secondary": "#526162", "surface-container-low": "#f6f3ee", "on-error": "#ffffff", "inverse-surface": "#31302d", "on-surface-variant": "#40484a", "on-primary": "#ffffff", "primary-fixed-dim": "#98cfdd", "tertiary-container": "#5e5043", "on-secondary-fixed": "#0f1e1f", "surface-container-high": "#ebe8e3", "surface-container-lowest": "#ffffff", "surface-tint": "#2c6672", "on-secondary-container": "#576768", "secondary-fixed": "#d5e6e7", "on-secondary": "#ffffff", "error": "#ba1a1a", "on-tertiary-container": "#d6c3b2", "on-tertiary": "#ffffff", "surface": "#fcf9f4" }, borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, spacing: { "space-lg": "1.5rem", "gutter-mobile": "1rem", "space-xs": "0.375rem", "gutter": "1rem", "space-md": "1rem", "space-xl": "2.25rem", "space-sm": "0.75rem", "margin": "1.25rem", "margin-mobile": "1.25rem" }, fontFamily: { "body-lg": ["Atkinson Hyperlegible Next"], "body-md": ["Atkinson Hyperlegible Next"], "label-md": ["Atkinson Hyperlegible Next"], "label-lg": ["Atkinson Hyperlegible Next"], "headline-sm": ["Atkinson Hyperlegible Next"], "headline-md": ["Atkinson Hyperlegible Next"], "body-sm": ["Atkinson Hyperlegible Next"], "headline-lg": ["Atkinson Hyperlegible Next"], "label-sm": ["Atkinson Hyperlegible Next"] }, fontSize: { "body-lg": ["19px", { "lineHeight": "28px", "fontWeight": "400" }], "body-md": ["17px", { "lineHeight": "26px", "fontWeight": "400" }], "label-md": ["15px", { "lineHeight": "20px", "fontWeight": "700" }], "label-lg": ["17px", { "lineHeight": "24px", "fontWeight": "700" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "700" }], "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }], "body-sm": ["15px", { "lineHeight": "22px", "fontWeight": "400" }], "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }], "label-sm": ["13px", { "lineHeight": "18px", "fontWeight": "700" }] } } } };</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col pt-safe pb-safe selection:bg-secondary-container selection:text-on-secondary-fixed"><main class="flex-1 flex flex-col relative w-full bg-surface px-margin-mobile py-space-lg"><div class="flex flex-col w-full">
<div class="flex items-center justify-between mb-space-lg">
<button aria-label="Volver atrás" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container hover:bg-surface-container-high transition-colors active:scale-95 shadow-sm text-on-surface" type="button">
<span class="material-symbols-rounded text-[24px]">arrow_back</span>
</button>
<div class="inline-flex items-center gap-2 px-4 py-2.5 rounded-full bg-secondary-container text-on-secondary-fixed shadow-sm">
<span class="material-symbols-rounded text-[20px] text-primary" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-md text-label-md">Perfil: Paciente</span>
</div>
</div>
<div class="mb-space-lg">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-tertiary-fixed text-on-tertiary-fixed mb-2 shadow-sm">
<span class="material-symbols-rounded text-[18px]">spa</span>
<span class="font-label-sm text-label-sm">Neurotrack EM</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-1" id="page-title">
      Crea tu cuenta
    </h1>
<p class="font-body-md text-body-md text-secondary" id="page-subtitle">
      Comienza a registrar tu proceso día a día.
    </p>
</div>
<div class="p-1.5 rounded-full bg-surface-container-high flex items-center mb-space-xl shadow-sm">
<button class="flex-1 h-12 rounded-full font-label-md text-label-md transition-all duration-200 text-secondary flex items-center justify-center" id="tab-login" type="button">
      Iniciar sesión
    </button>
<button class="flex-1 h-12 rounded-full font-label-md text-label-md transition-all duration-200 bg-primary-container text-on-primary shadow-sm flex items-center justify-center" id="tab-register" type="button">
      Crear cuenta
    </button>
</div>
<form class="flex flex-col gap-space-md" id="auth-form" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-1.5" id="field-name">
<label class="font-label-md text-label-md text-on-surface px-1" for="input-name">
        Nombre
      </label>
<div class="relative flex items-center">
<input autocomplete="name" class="w-full h-14 pl-5 pr-4 rounded-full bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md shadow-sm outline-none transition-shadow focus:shadow-md" id="input-name" placeholder="Tu nombre o cómo prefieres que te llamemos" type="text"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface px-1" for="input-email">
        Correo electrónico
      </label>
<div class="relative flex items-center">
<input autocomplete="email" class="w-full h-14 pl-5 pr-4 rounded-full bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md shadow-sm outline-none transition-shadow focus:shadow-md" id="input-email" placeholder="tu@correo.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface px-1" for="input-password">
        Contraseña
      </label>
<div class="relative flex items-center">
<input autocomplete="new-password" class="w-full h-14 pl-5 pr-14 rounded-full bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md shadow-sm outline-none transition-shadow focus:shadow-md" id="input-password" placeholder="••••••••" type="password"/>
<button aria-label="Mostrar u ocultar contraseña" class="absolute right-1 w-12 h-12 flex items-center justify-center rounded-full text-secondary hover:text-on-surface active:scale-95 transition-colors" id="toggle-pwd" type="button">
<span class="material-symbols-rounded text-[22px]">visibility_off</span>
</button>
</div>
</div>
<div class="flex flex-col gap-1.5" id="field-confirm">
<label class="font-label-md text-label-md text-on-surface px-1" for="input-confirm-password">
        Confirmar contraseña
      </label>
<div class="relative flex items-center">
<input autocomplete="new-password" class="w-full h-14 pl-5 pr-14 rounded-full bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md shadow-sm outline-none transition-shadow focus:shadow-md" id="input-confirm-password" placeholder="••••••••" type="password"/>
<button aria-label="Mostrar u ocultar confirmación de contraseña" class="absolute right-1 w-12 h-12 flex items-center justify-center rounded-full text-secondary hover:text-on-surface active:scale-95 transition-colors" id="toggle-confirm-pwd" type="button">
<span class="material-symbols-rounded text-[22px]">visibility_off</span>
</button>
</div>
</div>
<div class="pt-space-sm flex flex-col gap-space-lg">
<button class="w-full h-14 rounded-full bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md hover:opacity-95 active:scale-[0.98] transition-all" id="submit-btn" type="submit">
<span>Crear cuenta</span>
<span class="material-symbols-rounded text-[20px]">arrow_forward</span>
</button>
<div class="flex items-start gap-3 px-4 py-3.5 rounded-2xl bg-surface-container-low shadow-sm">
<span class="material-symbols-rounded text-[22px] text-primary shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">lock</span>
<p class="font-body-sm text-body-sm text-secondary leading-snug">
          Tus datos de salud se guardan cifrados y solo tú decides quién los ve.
        </p>
</div>
</div>
</form>
</div>
<script>
  (function() {
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const fieldName = document.getElementById('field-name');
    const fieldConfirm = document.getElementById('field-confirm');
    const title = document.getElementById('page-title');
    const subtitle = document.getElementById('page-subtitle');
    const submitBtn = document.getElementById('submit-btn');

    function setupPasswordToggle(buttonId, inputId) {
      const btn = document.getElementById(buttonId);
      const input = document.getElementById(inputId);
      if (!btn || !input) return;
      btn.addEventListener('click', () => {
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        const icon = btn.querySelector('.material-symbols-rounded');
        if (icon) {
          icon.textContent = isPassword ? 'visibility' : 'visibility_off';
        }
      });
    }

    setupPasswordToggle('toggle-pwd', 'input-password');
    setupPasswordToggle('toggle-confirm-pwd', 'input-confirm-password');

    function setTab(isRegister) {
      if (isRegister) {
        tabRegister.className = 'flex-1 h-12 rounded-full font-label-md text-label-md transition-all duration-200 bg-primary-container text-on-primary shadow-sm flex items-center justify-center';
        tabLogin.className = 'flex-1 h-12 rounded-full font-label-md text-label-md transition-all duration-200 text-secondary flex items-center justify-center';
        fieldName.classList.remove('hidden');
        fieldConfirm.classList.remove('hidden');
        title.textContent = 'Crea tu cuenta';
        subtitle.textContent = 'Comienza a registrar tu proceso día a día.';
        submitBtn.querySelector('span:first-child').textContent = 'Crear cuenta';
      } else {
        tabLogin.className = 'flex-1 h-12 rounded-full font-label-md text-label-md transition-all duration-200 bg-primary-container text-on-primary shadow-sm flex items-center justify-center';
        tabRegister.className = 'flex-1 h-12 rounded-full font-label-md text-label-md transition-all duration-200 text-secondary flex items-center justify-center';
        fieldName.classList.add('hidden');
        fieldConfirm.classList.add('hidden');
        title.textContent = 'Hola de nuevo';
        subtitle.textContent = 'Ingresa a tu espacio para continuar tu registro.';
        submitBtn.querySelector('span:first-child').textContent = 'Iniciar sesión';
      }
    }

    tabLogin.addEventListener('click', () => setTab(false));
    tabRegister.addEventListener('click', () => setTab(true));
  })();
</script></main></body></html>
