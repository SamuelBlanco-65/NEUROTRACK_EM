name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      # Valores de relleno: las pruebas no hablan con Supabase, pero `src/lib/supabase.ts` exige que existan.
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Pruebas
        run: npm test -- --ci
      - name: Dependencias (solo producción, avisos altos o críticos)
        run: npm audit --omit=dev --audit-level=high
